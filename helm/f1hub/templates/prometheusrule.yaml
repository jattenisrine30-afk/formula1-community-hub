{{- if .Values.monitoring.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: backend-alerts
  namespace: {{ .Release.Namespace }}
  labels:
    release: monitoring
spec:
  groups:
    - name: f1hub-backend
      rules:
        - alert: BackendDown
          expr: absent(up{job="backend", namespace="f1hub"} == 1)
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Le backend F1 Hub est indisponible"
            description: "Aucune instance saine du backend n'est détectée depuis plus d'une minute."

        - alert: BackendHighErrorRate
          expr: sum(rate(http_server_requests_seconds_count{namespace="f1hub", status=~"5.."}[5m])) > 0.1
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "Taux d'erreurs 5xx élevé sur le backend"
            description: "Le backend renvoie plus de 0,1 erreur serveur par seconde depuis 2 minutes."
  {{- end }}